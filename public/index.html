<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruiter Bot</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 24px 16px;
      background: #f4f6f8;
      color: #1f2933;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 4px;
    }
    .subtitle {
      margin: 0 0 24px;
      color: #52606d;
    }
    .pickers {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }
    .pickers label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: bold;
    }
    select {
      min-width: 260px;
      padding: 8px;
      font-size: 15px;
    }
    .summary {
      background: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .summary h2 {
      margin: 0 0 6px;
      font-size: 20px;
    }
    .summary p {
      margin: 4px 0;
    }
    .table-wrapper {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #d9e2ec;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #243b53;
      color: #ffffff;
      font-size: 14px;
    }
    td.number {
      text-align: center;
      white-space: nowrap;
    }
    td.name {
      min-width: 130px;
      font-weight: bold;
    }
    .score {
      font-weight: bold;
      font-size: 18px;
    }
    .bar {
      height: 6px;
      background: #d9e2ec;
      border-radius: 3px;
      margin-top: 4px;
      width: 60px;
    }
    .bar-fill {
      height: 100%;
      background: #2f80ed;
      border-radius: 3px;
    }
    .reason {
      font-size: 14px;
      color: #52606d;
    }
    .message {
      color: #52606d;
    }
    .error {
      color: #c62828;
    }
  </style>
</head>
<body>
  <main>
    <h1>Recruiter Bot</h1>
    <p class="subtitle">Choose a job to rank candidates, or a candidate to rank jobs.</p>

    <div class="pickers">
      <label>
        Job
        <select id="job-select">
          <option value="">Select a job</option>
        </select>
      </label>
      <label>
        Candidate
        <select id="candidate-select">
          <option value="">Select a candidate</option>
        </select>
      </label>
    </div>

    <div id="results">
      <p class="message">Results will appear here.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
